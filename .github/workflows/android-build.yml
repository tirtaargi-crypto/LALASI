name: LALASI by DanRey - Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  # The only APK we build: release = R8 shrunk + optimised, baseline profile, arm64 only.
  # A debug Compose build runs several times slower per frame, so it is never the one to judge smoothness by.
  build_release:
    name: Build LALASI Release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # signed with app/persistent-debug.keystore when no release key exists, so it installs over earlier builds
      - name: Build Release APK
        run: ./gradlew :app:assembleArm64GmsRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Validate and rename APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/arm64Gms/release/*.apk | head -n 1)
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/LALASI-v2.2.9-arm64-release.apk
          ls -l dist

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LALASI-DANREY-RELEASE
          path: dist/LALASI-v2.2.9-arm64-release.apk
          if-no-files-found: error
