name: LALASI by DanRey - Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_debug:
    name: Build LALASI Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show Gradle and JDK versions
        run: ./gradlew --version

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clean
        run: ./gradlew clean --no-configuration-cache --console=plain

      - name: Build Debug APK
        run: ./gradlew :app:assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Validate and rename APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/universalGms/debug/*.apk | head -n 1)
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/LALASI-DanRey-debug.apk
          ls -l dist

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LALASI-DANREY-DEBUG
          path: dist/LALASI-DanRey-debug.apk
          if-no-files-found: error
